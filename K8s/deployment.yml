apiVersion: apps/v1
kind: Deployment

metadata:
  name: dock-test-k8s #The name of this Deployment inside the Kubernetes cluster.
  namespace: dev

spec:
  replicas: 4

  selector:
    matchLabels:
      app: dock-test-k8s   # Maintains all the pods with name

  template:
    metadata:
      labels:
        app: dock-test-k8s  #Every Pod created from this template will have label app=dock-test-k8s

    spec:
      containers:
        - name: dock-test-k8s # Create a container inside the Pod and give that container the name dock-test-k8s
          image: vinayakwarad/dock-test:v1 #Image from my docker account
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: my-config-file
